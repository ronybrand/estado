# Valida a imagem native (Dockerfile.native) com o metadata versionado: builda,
# sobe o container contra um Postgres de servico e roda o smoke. So dispara
# quando algo que afeta o native muda. A imagem de producao e essa mesma
# (publicada como latest pelo docker-publish, ver ADR 0022); este workflow
# so valida, nao publica nada.
name: Native Image

on:
  pull_request:
    paths:
      - "Dockerfile.native"
      - "build.gradle.kts"
      - "src/main/**"
      - ".github/native-smoke.sh"
      - ".github/workflows/native-image.yml"
  push:
    branches: [master]
    paths:
      - "Dockerfile.native"
      - "build.gradle.kts"
      - "src/main/**"
  workflow_dispatch:

concurrency:
  group: native-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: estado
          POSTGRES_USER: estado
          POSTGRES_PASSWORD: x
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U estado" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4

      - name: Build da imagem native
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: Dockerfile.native
          load: true
          tags: estado:native
          build-args: |
            NATIVE_ARGS=-PnativeQuick
          cache-from: type=gha,scope=native-image
          cache-to: type=gha,mode=max,scope=native-image

      - name: Sobe o container e roda o smoke
        run: |
          HASH=$(htpasswd -nbBC 10 admin admin123 | cut -d: -f2)
          docker run -d --name app --network host --memory 384m \
            -e JDBC_DATABASE_URL=jdbc:postgresql://localhost:5432/estado \
            -e JDBC_DATABASE_USERNAME=estado -e JDBC_DATABASE_PASSWORD=x \
            -e API_ORIGIN_PERMITIDA=http://localhost:4200 -e ADMIN_USERNAME=admin \
            -e "ADMIN_PASSWORD_HASH=$HASH" \
            -e JWT_SECRET=c3Bpa2Utand0LXNlY3JldC1zcGlrZS1qd3Qtc2VjcmV0LTEyMzQ1Ng== \
            -e ASK_API_KEY=k -e ASK_API_BASE_URL=http://localhost:9 \
            -e SPRINGDOC_API_DOCS_ENABLED=false -e SPRINGDOC_SWAGGER_UI_ENABLED=false \
            estado:native
          RESULT=$(bash .github/native-smoke.sh)
          echo "$RESULT"
          sleep 10
          PID=$(docker inspect app --format '{{.State.Pid}}')
          {
            echo "### Native image"
            echo "- smoke: \`$RESULT\`"
            echo "- subida: $(docker logs app 2>&1 | grep -oE 'Started [A-Za-z]+ in [0-9.]+ seconds' | tail -1)"
            echo "- memoria: $(grep -E 'RssAnon|RssFile' /proc/$PID/status | tr -s ' \t' ' ' | tr '\n' ' ')"
          } | tee -a "$GITHUB_STEP_SUMMARY"

          # Metricas que o dashboard e os alertas do ADR 0012 consomem. O native expoe
          # menos metricas jvm_*, mas nenhuma delas e usada la.
          curl -s http://localhost:8080/actuator/prometheus > prom.txt
          for serie in \
            'http_server_requests_seconds_bucket{[^}]*application="estado"' \
            'http_server_requests_seconds_count{[^}]*outcome="SERVER_ERROR"' \
            'hikaricp_connections_active{[^}]*application="estado"'; do
            grep -q "$serie" prom.txt || { echo "FALTA metrica do dashboard: $serie"; exit 1; }
          done
          echo "- metricas do dashboard: ok (jvm_*: $(grep -c '^jvm_' prom.txt) series, process_*: $(grep -c '^process_' prom.txt))" | tee -a "$GITHUB_STEP_SUMMARY"
          for esperado in health=200 login_errado=401 login_ok=200 post=201 paginado=200 get=200 put=200 invalido=400 inexistente=404 sem_auth=401 delete=204 prom=200; do
            echo "$RESULT" | grep -qw "$esperado" || { echo "FALHOU: esperado $esperado"; docker logs app 2>&1 | tail -40; exit 1; }
          done
