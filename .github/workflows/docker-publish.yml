name: Docker Publish

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-push:
    # latest = imagem native (ADR 0022); a JVM continua sendo publicada como
    # jvm-latest / jvm-<sha> pra ter volta imediata (rollback.sh jvm-<sha>).
    # fail-fast desligado: se o native falhar (ex.: metadata de reflexao
    # desatualizado), a latest nao muda e o timer da EC2 segue na imagem atual.
    strategy:
      fail-fast: false
      matrix:
        include:
          - variante: native
            arquivo: Dockerfile.native
            tag_latest: latest
            prefixo: ""
          - variante: jvm
            arquivo: Dockerfile
            tag_latest: jvm-latest
            prefixo: "jvm-"
    # workflow_run inclui PRs de fora (inclusive forks), ja que o CI roda em
    # pull_request - so builda/publica se o CI que passou foi disparado por um
    # push (codigo ja mergeado em master), nunca pelo head de um PR nao
    # confiavel. Sem isso, um PR malicioso poderia fazer o build usar seu
    # proprio head_sha e publicar imagem sua em ghcr.io com o GITHUB_TOKEN
    # (packages: write) deste job.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ matrix.tag_latest }}
            type=sha,prefix=${{ matrix.prefixo }},format=long

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.arquivo }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_COMMIT=${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=${{ matrix.variante }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variante }}
