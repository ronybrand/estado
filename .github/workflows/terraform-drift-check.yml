name: Terraform Drift Check

on:
  schedule:
    # Semanal, mesma cadencia do prune de imagens (ver ADR 0009) - ritmo
    # proporcional de manutencao automatizada ja estabelecido neste projeto.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          # ARN fixo de proposito (nao da pra derivar do output Terraform
          # aqui - o workflow precisa das credenciais ANTES de rodar
          # terraform init/plan, entao nao ha como ler o output primeiro).
          # Precisa ficar em sincronia manual com o output
          # "terraform_plan_role_arn" (terraform/outputs.tf) e com
          # var.role_name (default "estado-terraform-plan" em
          # modules/github-oidc-plan/variables.tf) - se qualquer um dos dois
          # mudar, atualize esta linha tambem.
          role-to-assume: arn:aws:iam::875304087242:role/estado-terraform-plan
          aws-region: sa-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.15"
          # O wrapper padrao da action trata exit code 2 (drift real, via
          # -detailed-exitcode) como sucesso, igual ao exit code 0 - sem
          # desabilita-lo o job nunca falharia quando ha drift, contrariando
          # o proprio proposito deste workflow.
          terraform_wrapper: false

      - run: terraform init -input=false

      # Exit code 2 (ha diferenca) falha o job de proposito - sinal de drift
      # real pra investigar. Exit code 0 (sem mudanca) passa; exit code 1
      # (erro) ja falha o job normalmente, sem precisar de tratamento extra.
      - run: terraform plan -input=false -detailed-exitcode -no-color
