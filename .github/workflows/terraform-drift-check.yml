name: Terraform Drift Check

on:
  schedule:
    # Semanal, mesma cadencia do prune de imagens (ver ADR 0009) - ritmo
    # proporcional de manutencao automatizada ja estabelecido neste projeto.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    env:
      # As 3 variaveis obrigatorias sem default em terraform/variables.tf -
      # sem elas "terraform plan" falha antes de tocar a AWS. admin_cidr e
      # sensivel (IP do operador) por isso vai como secret, nao repo var.
      TF_VAR_admin_cidr: ${{ secrets.ADMIN_CIDR }}
      TF_VAR_frontend_bucket_name: ${{ vars.FRONTEND_BUCKET_NAME }}
      TF_VAR_frontend_github_repo: ${{ vars.FRONTEND_GITHUB_REPO }}
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          # Fonte da verdade e o output "terraform_plan_role_arn"
          # (terraform/outputs.tf), gravado como repository variable apos
          # cada apply que mude a role - nao da pra ler o output aqui
          # diretamente porque o workflow precisa das credenciais ANTES de
          # rodar terraform init/plan (problema de bootstrap).
          role-to-assume: ${{ vars.TERRAFORM_PLAN_ROLE_ARN }}
          aws-region: sa-east-1

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.15"
          # O wrapper padrao da action trata exit code 2 (drift real, via
          # -detailed-exitcode) como sucesso, igual ao exit code 0 - sem
          # desabilita-lo o job nunca falharia quando ha drift, contrariando
          # o proprio proposito deste workflow.
          terraform_wrapper: false

      - run: terraform init -input=false

      # Exit code 2 (ha diferenca) falha o job de proposito - sinal de drift
      # real pra investigar. Exit code 0 (sem mudanca) passa; exit code 1
      # (erro) ja falha o job normalmente, sem precisar de tratamento extra.
      - run: terraform plan -input=false -detailed-exitcode -no-color
