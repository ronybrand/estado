# Regera o reachability-metadata.json do native image: roda o app na JVM sob o
# agente de rastreamento do GraalVM exercitando os endpoints (native-smoke.sh) e
# publica o arquivo filtrado como artefato. Rodar manualmente quando o codigo ou
# as dependencias mudarem e commitar o resultado em
# src/main/resources/META-INF/native-image/br.com.rony/estado/.
name: Native Metadata

on:
  workflow_dispatch:
  push:
    branches: [feat/native-image-build]
    paths: [".github/workflows/native-metadata.yml", ".github/native-smoke.sh"]

jobs:
  gerar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: estado
          POSTGRES_USER: estado
          POSTGRES_PASSWORD: x
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U estado" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      JDBC_DATABASE_URL: jdbc:postgresql://localhost:5432/estado
      JDBC_DATABASE_USERNAME: estado
      JDBC_DATABASE_PASSWORD: x
      API_ORIGIN_PERMITIDA: http://localhost:4200
      ADMIN_USERNAME: admin
      JWT_SECRET: c3Bpa2Utand0LXNlY3JldC1zcGlrZS1qd3Qtc2VjcmV0LTEyMzQ1Ng==
      ASK_API_KEY: k
      ASK_API_BASE_URL: http://localhost:9
      SPRINGDOC_API_DOCS_ENABLED: "false"
      SPRINGDOC_SWAGGER_UI_ENABLED: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1.6.7
        with:
          java-version: "25"
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Hash BCrypt da senha de teste
        run: |
          echo "ADMIN_PASSWORD_HASH=$(htpasswd -nbBC 10 admin admin123 | cut -d: -f2)" >> "$GITHUB_ENV"

      - run: ./gradlew --no-daemon bootJar -x test

      - name: Rastreia a reflexao com o agente
        run: |
          java -agentlib:native-image-agent=config-output-dir=agent-out -jar build/libs/estado-0.0.1-SNAPSHOT.jar > agent-run.log 2>&1 &
          PID=$!
          bash .github/native-smoke.sh | tee smoke-agent.txt
          kill -TERM $PID; wait $PID || true
          # O smoke tem que ter passado inteiro, senao o metadata fica incompleto.
          if grep -qE 'FALHA|=000' smoke-agent.txt; then echo "smoke falhou"; exit 1; fi
          # Hibernate 7 escolhe o BytecodeProvider so via ServiceLoader (sem servico =
          # provedor no-op). O agente grava o META-INF/services como recurso, o que
          # forcaria o ByteBuddy no native, que nao pode definir classes em runtime.
          mkdir -p out
          jq 'walk(if type == "array" then map(select((tostring | test("bytecode.spi.BytecodeProvider|bytebuddy.BytecodeProviderImpl")) | not)) else . end)' agent-out/reachability-metadata.json > out/reachability-metadata.json
          ls -la out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reachability-metadata
          path: out/reachability-metadata.json
