name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # SonarQube Cloud usa o historico do git pra blame/analise de "new
          # code" - um checkout raso deixaria isso incompleto.
          fetch-depth: 0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - run: ./gradlew --no-daemon build
      - uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7
        with:
          files: build/reports/jacoco/test/jacocoTestReport.xml
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
      # SONAR_TOKEN precisa ser cadastrado como secret do repo depois de criar
      # a organizacao em sonarcloud.io/create-organization (free forever pra
      # repo publico com licenca OSI) - ver ADR 0021.
      - run: ./gradlew --no-daemon sonar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
