spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${JDBC_DATABASE_URL}
    username: ${JDBC_DATABASE_USERNAME}
    password: ${JDBC_DATABASE_PASSWORD}
  jpa:
    hibernate:
      # Schema gerenciado por Liquibase (db/changelog/), nao pelo Hibernate -
      # validate so confere que o mapeamento da entidade bate com o schema
      # aplicado, sem tentar alterar nada (ver ADR 0014).
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
api:
  # Aceita multiplas origens separadas por virgula (ex: "https://a,https://b").
  origin-permitida: ${API_ORIGIN_PERMITIDA:http://localhost:8000}
rate-limit:
  # Requisicoes permitidas por IP a cada janela-segundos (token bucket, ver
  # ADR 0016). Default generoso o bastante pra nao incomodar uso normal.
  capacidade: ${RATE_LIMIT_CAPACIDADE:60}
  janela-segundos: ${RATE_LIMIT_JANELA_SEGUNDOS:60}
admin:
  # Usuario admin unico, sem tabela de usuarios (ADR 0017). O hash da senha
  # nao tem default - falha rapido no boot em vez de rodar com credencial
  # adivinhavel.
  username: ${ADMIN_USERNAME:admin}
  password-hash: ${ADMIN_PASSWORD_HASH}
jwt:
  # Segredo HMAC pra assinar/validar o token - sem default, mesmo motivo do
  # admin acima.
  secret: ${JWT_SECRET}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
springdoc:
  # Habilitado por padrao (dev-friendly) - lib-swap.sh desliga explicitamente
  # em producao via env var, pra nao expor o Swagger UI publicamente.
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
logging:
  pattern:
    console: "%d %-5level [%X{requestId}] %logger : %msg%n"
  level:
    org.springframework: info
server:
  port: 8080 #set your port
  # Sem isso, request.getRemoteAddr() (usado pelo RateLimitFilter, ADR 0016)
  # sempre resolve pro IP do Caddy, nao do cliente real - o proxy injeta
  # X-Forwarded-For, mas o Spring so o usa se explicitamente habilitado.
  # Seguro aqui porque a app so e alcancavel via Caddy (porta nunca publicada
  # pro host, ver ADR 0012).
  forward-headers-strategy: framework
management:
  endpoints:
    web:
      exposure:
        # health ja era exposto por padrao (usado pelo lib-swap.sh no rolling
        # swap) - prometheus e info adicionados, nao substituem.
        include: health,prometheus,info
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      # prepara pra quando outro app do portfolio reusar o mesmo Alloy/Grafana
      # Cloud - sem isso, series de apps diferentes ficariam indistinguiveis.
      application: estado
    distribution:
      percentiles-histogram:
        # sem isso, http.server.requests so tem count+sum (media) - nao da pra
        # calcular P95/P99 de verdade. Custo (mais series, um contador por
        # bucket de latencia x endpoint x status) irrelevante pro volume desse
        # app - confirmado contra o teto do free tier do Grafana Cloud.
        http.server.requests: true