# Roda em ~/estado/ na instância. Só cuida do Postgres — o container da app
# (estado-app) é gerenciado inteiramente por deploy.sh, não pelo Compose,
# pra evitar os dois mecanismos disputando o mesmo container (ver ADR 0005).
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: estado
      POSTGRES_USER: estado
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal

networks:
  # nome fixo (nao o "estado_internal" que o Compose geraria por padrao a
  # partir do nome do projeto) pra deploy.sh conseguir anexar o container da
  # app na mesma rede via "docker run --network estado_internal", fora do
  # ciclo de vida do Compose.
  internal:
    name: estado_internal

volumes:
  postgres-data:
